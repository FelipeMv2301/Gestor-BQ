<div class="bg-surface border border-line rounded-2xl p-6">
  <h2 class="text-sm font-bold text-ink mb-4">Dirección</h2>
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="block sm:col-span-2"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Dirección</span>
      <input type="text" name="destinatario_direccion" value="{{ pedidos.0.direccion_calle }}" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Comuna</span>
      <input type="text" name="destinatario_comuna" data-comuna value="{{ pedidos.0.direccion_comuna }}" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
  </div>
</div>

<div class="bg-surface border border-line rounded-2xl p-6">
  <h2 class="text-sm font-bold text-ink mb-4">Datos del courier</h2>
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Centro remitente</span>
      <select name="centro" required class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none">
        <option value="02">02 - Biotecnología</option>
        <option value="03">03 - Educación</option>
        <option value="04">04 - Genérico</option>
      </select></label>
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Servicio</span>
      <select name="servicio" required class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none">
        <option value="10" {% if pedidos.0.servicio_courier_codigo == "10" %}selected{% endif %}>10 - Express</option>
        <option value="20" {% if pedidos.0.servicio_courier_codigo == "20" %}selected{% endif %}>20 - Terrestre</option>
      </select>
      {% if pedidos.0.servicio_courier_nombre %}<p class="text-xs text-muted mt-1">Detectado desde SAP: {{ pedidos.0.servicio_courier_nombre }}. Puedes cambiarlo si hace falta.</p>{% endif %}
    </label>
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Valor declarado</span>
      <input type="number" name="valor_declarado" value="0" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
    <label class="block sm:col-span-2"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Observaciones</span>
      <textarea name="observaciones" maxlength="255" rows="2" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></textarea></label>
  </div>
</div>

<div class="bg-surface border border-line rounded-2xl p-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-sm font-bold text-ink">Bultos</h2>
    <div class="inline-flex bg-appbg border border-line p-1 rounded-xl gap-1 text-sm">
      <label class="cursor-pointer"><input type="radio" name="modo_bultos" value="detallado" class="peer sr-only" checked onclick="mostrarModoBultos()">
        <span class="block px-3 py-1 rounded-lg text-muted font-semibold peer-checked:bg-surface peer-checked:text-ink peer-checked:shadow-sm">Detallado</span></label>
      <label class="cursor-pointer"><input type="radio" name="modo_bultos" value="simple" class="peer sr-only" onclick="mostrarModoBultos()">
        <span class="block px-3 py-1 rounded-lg text-muted font-semibold peer-checked:bg-surface peer-checked:text-ink peer-checked:shadow-sm">Simple</span></label>
    </div>
  </div>

  <div id="bultos-simple" class="hidden grid gap-4 sm:grid-cols-2">
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Cantidad de bultos</span>
      <input type="number" name="simple_cantidad" value="1" min="1" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Peso total (kg)</span>
      <input type="number" name="simple_peso_total" step="0.01" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Volumen total (opcional)</span>
      <input type="text" name="volumen_total" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Contenido</span>
      <select name="simple_tipo_contenido" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none">
        <option value="SECO">SECO</option><option value="REFRIGERADO">REFRIGERADO</option><option value="REFRIGERADO CON SENSOR">REFRIGERADO CON SENSOR</option>
      </select></label>
  </div>

  <div id="bultos-detallado">
    <div class="overflow-x-auto">
      <table class="w-full text-sm min-w-[640px]">
        <thead><tr class="text-xs uppercase tracking-wide text-muted text-left">
          <th class="py-2 pr-2">Tipo</th><th class="py-2 px-2">Cant.</th><th class="py-2 px-2">Alto</th><th class="py-2 px-2">Ancho</th><th class="py-2 px-2">Largo</th><th class="py-2 px-2">Peso (kg)</th><th class="py-2 pl-2">Contenido</th><th class="py-2 pl-2 w-8"></th>
        </tr></thead>
        <tbody id="filas-bultos">
          <tr>
            <td class="py-1 pr-2"><select name="bulto_tipo" class="text-sm rounded-lg border border-linestrong bg-field text-body px-2 py-1.5">
              <option value="CAJA" selected>CAJA</option><option value="BULTO">BULTO</option><option value="NEVERA L">NEVERA L</option><option value="NEVERAS S">NEVERAS S</option><option value="NEVERA M">NEVERA M</option><option value="SOBRE">SOBRE</option><option value="VALIJA">VALIJA</option><option value="PALLET">PALLET</option><option value="BOLSO/MALETA">BOLSO/MALETA</option><option value="CONTENEDOR">CONTENEDOR</option><option value="NEVERA XL">NEVERA XL</option>
            </select></td>
            <td class="py-1 px-2"><input type="number" name="bulto_cantidad" value="1" min="1" class="w-16 text-sm rounded-lg border border-linestrong bg-field text-body px-2 py-1.5"></td>
            <td class="py-1 px-2"><input type="text" name="bulto_alto" class="w-16 text-sm rounded-lg border border-linestrong bg-field text-body px-2 py-1.5"></td>
            <td class="py-1 px-2"><input type="text" name="bulto_ancho" class="w-16 text-sm rounded-lg border border-linestrong bg-field text-body px-2 py-1.5"></td>
            <td class="py-1 px-2"><input type="text" name="bulto_largo" class="w-16 text-sm rounded-lg border border-linestrong bg-field text-body px-2 py-1.5"></td>
            <td class="py-1 px-2"><input type="number" name="bulto_peso" step="0.01" required class="w-20 text-sm rounded-lg border border-linestrong bg-field text-body px-2 py-1.5"></td>
            <td class="py-1 pl-2"><select name="bulto_tipo_contenido" class="text-sm rounded-lg border border-linestrong bg-field text-body px-2 py-1.5">
              <option value="SECO">SECO</option><option value="REFRIGERADO">REFRIGERADO</option><option value="REFRIGERADO CON SENSOR">REFRIGERADO CON SENSOR</option>
            </select></td>
            <td class="py-1 pl-2 text-center"><button type="button" onclick="quitarFilaBulto(this)" class="text-muted hover:text-rech-ink" title="Quitar">✕</button></td>
          </tr>
        </tbody>
      </table>
    </div>
    <button type="button" onclick="agregarFilaBulto()" class="text-sm font-semibold text-brand-ink hover:underline mt-3">+ Agregar bulto</button>
  </div>
</div>

<div class="bg-surface border border-line rounded-2xl p-6">
  <div class="flex items-center justify-between mb-1">
    <h2 class="text-sm font-bold text-ink">Documentos (cedibles)</h2>
    <button type="button" onclick="agregarFilaDocumento()" class="text-sm font-semibold text-brand-ink hover:underline">+ Agregar documento</button>
  </div>
  <p class="text-xs text-muted mb-4">Opcional. Deja el tipo o el N° en blanco si no aplica.</p>
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead><tr class="text-xs uppercase tracking-wide text-muted text-left">
        <th class="py-2 pr-2 w-1/2">Tipo documento</th><th class="py-2 px-2">N° documento</th><th class="py-2 pl-2 w-8"></th>
      </tr></thead>
      <tbody id="filas-documentos">
        <tr>
          <td class="py-1 pr-2"><select name="doc_tipo" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-2 py-1.5">
            <option value="">Seleccione tipo</option>
            <option value="CED">CEDIBLE CON DEVOLUCIÓN</option>
          </select></td>
          <td class="py-1 px-2"><input type="text" name="doc_referencia" maxlength="40" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-2 py-1.5"></td>
          <td class="py-1 pl-2 text-center"><button type="button" onclick="quitarFilaDocumento(this)" class="text-muted hover:text-rech-ink" title="Quitar">✕</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  function agregarFilaDocumento() {
    var fila = document.querySelector('#filas-documentos tr');
    var nueva = fila.cloneNode(true);
    nueva.querySelectorAll('select, input').forEach(function (c) { c.value = ''; });
    document.getElementById('filas-documentos').appendChild(nueva);
  }
  function quitarFilaDocumento(boton) {
    if (document.querySelectorAll('#filas-documentos tr').length > 1) boton.closest('tr').remove();
  }
  function agregarFilaBulto() {
    var filaOriginal = document.querySelector("#filas-bultos tr");
    var filaNueva = filaOriginal.cloneNode(true);
    document.getElementById("filas-bultos").appendChild(filaNueva);
  }
  function quitarFilaBulto(boton) {
    if (document.querySelectorAll('#filas-bultos tr').length > 1) boton.closest('tr').remove();
  }
  function mostrarModoBultos() {
    var esSimple = document.querySelector('input[name="modo_bultos"][value="simple"]').checked;
    document.getElementById('bultos-simple').classList.toggle('hidden', !esSimple);
    document.getElementById('bultos-detallado').classList.toggle('hidden', esSimple);
    document.getElementsByName('bulto_peso').forEach(function (c) { c.required = !esSimple; });
  }
</script>
