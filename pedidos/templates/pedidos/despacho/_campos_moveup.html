<div class="bg-surface border border-line rounded-2xl p-6">
  <h2 class="text-sm font-bold text-ink mb-4">Dirección</h2>
  <p class="text-xs text-muted mb-3">MoveUP pide calle y número separados. Revisa y ajusta antes de despachar.</p>
  <div class="grid gap-4 sm:grid-cols-3">
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Calle</span>
      <input type="text" name="moveup_calle" value="{{ pedidos.0.direccion_calle }}" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Número</span>
      <input type="text" name="moveup_numero" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Depto / Casa</span>
      <input type="text" name="moveup_depto" value="{{ pedidos.0.direccion_depto }}" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
  </div>
</div>

<div class="bg-surface border border-line rounded-2xl p-6">
  <h2 class="text-sm font-bold text-ink mb-4">Datos del paquete (MoveUP)</h2>
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Tamaño</span>
      <select name="package_size" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none">
        <option value="2">Caja</option>
        <option value="1">Sobre</option>
      </select></label>
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Cantidad de paquetes</span>
      <input type="number" name="cantidad" value="1" min="1" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
    <label class="block"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Valor declarado</span>
      <input type="number" name="valor_declarado" value="0" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></label>
    <label class="block sm:col-span-2"><span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Observaciones</span>
      <textarea name="observaciones" maxlength="255" rows="2" class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></textarea></label>
  </div>
</div>
