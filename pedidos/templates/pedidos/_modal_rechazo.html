<div class="fixed inset-0 z-[70] flex items-center justify-center bg-black/40 p-4"
     onclick="if(event.target===this)document.getElementById('modal').innerHTML=''">
  <div class="bg-surface rounded-2xl shadow-lg max-w-md w-full p-6">
    <h2 class="text-lg font-bold text-ink">Anular pedido {{ pedido.origen }}-{{ pedido.num_pedido }}</h2>
    <p class="text-sm text-muted mt-1.5 leading-relaxed">El pedido se archivará y saldrá de circulación. Si hace falta, se puede reingresar después desde Anulados.</p>
    <form hx-post="{% url 'pedidos:rechazar' pedido.pk %}" class="mt-4">
      <label class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">Motivo (opcional)</label>
      <textarea name="motivo" rows="3" placeholder="Por qué se anula…"
                class="w-full text-sm rounded-lg border border-linestrong bg-field text-body px-3 py-2 focus:border-brand focus:outline-none"></textarea>
      <div class="flex justify-end gap-2.5 mt-5">
        <button type="button" onclick="document.getElementById('modal').innerHTML=''"
                class="text-sm font-semibold px-4 py-2 rounded-full border border-linestrong bg-surface text-body hover:bg-appbg">Cancelar</button>
        <button type="submit"
                class="text-sm font-semibold px-4 py-2 rounded-full text-white shadow-sm bg-[#e0463a] hover:opacity-90">Anular pedido</button>
      </div>
    </form>
  </div>
</div>
