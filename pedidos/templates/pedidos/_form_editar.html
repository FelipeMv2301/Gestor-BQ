<div class="flex items-center gap-3 mb-5">
  <h1 class="text-2xl font-bold text-ink font-mono tabular-nums">{{ pedido.origen }}-{{ pedido.num_pedido }}</h1>
  <span class="text-sm text-muted">· Editando</span>
</div>
<form hx-post="{% url 'pedidos:editar' pedido.pk %}" hx-target="#detalle-cuerpo"
      class="bg-surface border border-line rounded-2xl p-6">
  <div class="grid gap-4 sm:grid-cols-2">
    {% for field in form %}
    <div class="{% if field.name == 'observaciones' %}sm:col-span-2{% endif %}">
      <label class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<p class="text-xs text-rech-ink mt-1">{{ field.errors|striptags }}</p>{% endif %}
    </div>
    {% endfor %}
  </div>
  <div class="flex gap-2.5 mt-6">
    <button type="submit" class="text-sm font-semibold px-4 py-2 rounded-full bg-brand text-white hover:bg-brand-ink shadow-sm">Guardar cambios</button>
    <button type="button" hx-get="{% url 'pedidos:detalle_cuerpo' pedido.pk %}" hx-target="#detalle-cuerpo"
            class="text-sm font-semibold px-4 py-2 rounded-full border border-linestrong bg-surface text-body hover:bg-appbg">Cancelar</button>
  </div>
</form>
