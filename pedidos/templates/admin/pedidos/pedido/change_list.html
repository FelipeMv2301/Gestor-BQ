{% extends "admin/change_list.html" %}

{% block object-tools-items %}

        {% csrf_token %}
        <input type="date" name="after" required>

        <button type="submit" class="button">Sincronizar Pedidos</button>
    </form>
</li>
{{ block.super }}
{% endblock %}
