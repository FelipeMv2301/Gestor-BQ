<div>
  <!-- Cabecera: de quién es el perfil que se está editando. El panel es sticky y se reemplaza vía
       htmx sin recargar, así que sin esto se pierde de vista a quién corresponde el formulario. -->
  <div class="flex items-start gap-3 pb-4 mb-5 border-b border-line">
    <span class="shrink-0 w-9 h-9 rounded-full bg-brand-soft text-brand-ink grid place-items-center text-sm font-bold uppercase">
      {{ perfil.usuario.get_full_name|default:perfil.usuario.email|first }}
    </span>
    <div class="min-w-0">
      <p class="text-xs font-semibold uppercase tracking-wide text-muted">Editando</p>
      <h2 class="text-base font-bold text-ink truncate" title="{{ perfil.usuario.get_full_name|default:perfil.usuario.email }}">
        {{ perfil.usuario.get_full_name|default:perfil.usuario.email }}</h2>
      <p class="text-xs text-muted font-mono truncate mt-0.5" title="{{ perfil.usuario.email }}">{{ perfil.usuario.email }}</p>
    </div>
  </div>

  <form hx-post="{% url 'editar_perfil' perfil.pk %}" hx-target="#panel-editar-perfil" class="flex flex-col gap-5">
    <label class="block">
      <span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1.5">{{ form.rol.label }}</span>
      {{ form.rol }}
      {% if form.rol.errors %}<p class="text-xs text-rech-ink mt-1.5">{{ form.rol.errors|striptags }}</p>{% endif %}
    </label>

    <label class="block">
      <span class="block text-xs font-semibold uppercase tracking-wide text-muted mb-1.5">{{ form.codigos_sap.label }}</span>
      {{ form.codigos_sap }}
      <span class="block text-xs text-muted mt-1.5 leading-relaxed">{{ form.codigos_sap.help_text }} (mira la tabla de la izquierda).</span>
      {% if form.codigos_sap.errors %}<p class="text-xs text-rech-ink mt-1.5">{{ form.codigos_sap.errors|striptags }}</p>{% endif %}
    </label>

    <!-- Checkbox como fila con caja propia: el input suelto junto al texto quedaba apretado y sin
         zona de click clara. items-start + h-5 alinea el cuadrito con la primera línea del label. -->
    <div>
      <label class="flex items-start gap-3 rounded-lg border border-line bg-appbg px-3.5 py-3 cursor-pointer hover:border-linestrong">
        <span class="flex items-center h-5 shrink-0">{{ form.ve_todas_cotizaciones }}</span>
        <span class="min-w-0">
          <span class="block text-sm font-medium text-body leading-snug">{{ form.ve_todas_cotizaciones.label }}</span>
          {% if form.ve_todas_cotizaciones.help_text %}
          <span class="block text-xs text-muted mt-1 leading-relaxed">{{ form.ve_todas_cotizaciones.help_text }}</span>
          {% endif %}
        </span>
      </label>
      {% if form.ve_todas_cotizaciones.errors %}<p class="text-xs text-rech-ink mt-1.5">{{ form.ve_todas_cotizaciones.errors|striptags }}</p>{% endif %}
    </div>

    <button type="submit" class="text-sm font-semibold px-4 py-2 rounded-full bg-brand text-white hover:bg-brand-ink shadow-sm">Guardar</button>
  </form>
</div>
