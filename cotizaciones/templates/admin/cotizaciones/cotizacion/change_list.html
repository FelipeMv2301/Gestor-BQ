{% extends "admin/change_list.html" %}
{% block object-tools-items %}
  <li>
    <form method="post" action="{% url 'admin:cotizaciones_cotizacion_sincronizar' %}"
          style="display:flex; gap:.5rem; align-items:center;">
      {% csrf_token %}
      <label>Desde <input type="date" name="after" required></label>
      <label>Hasta <input type="date" name="before"></label>
      <button type="submit" class="button">Sincronizar cotizaciones</button>
    </form>
  </li>
  <li>
    <form method="post" action="{% url 'admin:cotizaciones_cotizacion_refrescar_abiertas' %}">
      {% csrf_token %}
      <button type="submit" class="button">Refrescar abiertas</button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
