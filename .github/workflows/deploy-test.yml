name: Deploy a gestor-test

on:
  push:
    branches: [desarrollo]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/gestorbq/gestorBQ-test
    steps:
      - uses: actions/checkout@v4

      - name: Build y reinicio del contenedor
        run: |
          docker compose build
          docker compose up -d

      - name: Migraciones + estáticos
        run: |
          docker compose exec -T app python manage.py migrate --noinput
          docker compose exec -T app python manage.py collectstatic --noinput

      - name: Limpieza de imágenes viejas
        run: docker image prune -f
