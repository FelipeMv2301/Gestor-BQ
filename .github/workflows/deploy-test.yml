name: Deploy a gestor-test

on:
  push:
    branches: [desarrollo]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/gestorbq/gestorBQ-test
    steps:
      #Sin "path" absoluto, checkout clona en el workspace propio del runner (_work/...), NO en
      #working-directory (eso solo cambia el cwd de los pasos "run", no de esta acción). "clean:
      #false" es clave: evita que git limpie archivos sin versionar en cada deploy — el .env real
      #de producción/test vive ahí y no está en git (nunca se versiona, ver .gitignore).
      - uses: actions/checkout@v4
        with:
          path: /home/gestorbq/gestorBQ-test
          clean: false

      - name: Build y reinicio del contenedor
        run: |
          docker compose build
          docker compose up -d

      - name: Migraciones + estáticos
        run: |
          docker compose exec -T app python manage.py migrate --noinput
          docker compose exec -T app python manage.py collectstatic --noinput

      - name: Limpieza de imágenes viejas
        run: docker image prune -f
