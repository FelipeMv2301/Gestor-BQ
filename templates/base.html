{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Portal Bioquímica{% endblock %}</title>

  <link rel="icon" type="image/svg+xml" href="{% static 'images/icono.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/tom-select/tom-select-2.3.1.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    :root {
      --appbg:#edf4f4; --surface:#ffffff; --field:#ffffff; --line:#dbe8e8; --linestrong:#c6d8d8;
      --body:#1c2b2d; --muted:#5f7476; --ink:#12262a;
      --brand:#0b8f9c; --brand-ink:#076370; --brand-soft:#dbf1f2;
      --lime:#6faa38; --lime-ink:#4a6f24; --lime-soft:#eaf5dd;
      --pend-bg:#fdefdd; --pend-ink:#965310; --pend-dot:#ef8f2a;
      --apro-bg:#dbf1f2; --apro-ink:#076370; --apro-dot:#0b8f9c;
      --noti-bg:#eaf5dd; --noti-ink:#466518; --noti-dot:#7ab648;
      --rech-bg:#fbe4e2; --rech-ink:#8c261d; --rech-dot:#e0463a;
    }
    .dark {
      --appbg:#0e1417; --surface:#161c21; --field:#1c242a; --line:#29323a; --linestrong:#3a454e;
      --body:#dfe7ec; --muted:#93a1ab; --ink:#eef4f6;
      --brand:#2cbae2; --brand-ink:#8bdcef; --brand-soft:#0c2c34;
      --lime:#8fc85a; --lime-ink:#a9d167; --lime-soft:#1f2c12;
      --pend-bg:#352a12; --pend-ink:#f0b46a; --pend-dot:#ef8f2a;
      --apro-bg:#0c2c34; --apro-ink:#6fd2dd; --apro-dot:#2cbae2;
      --noti-bg:#1f2c12; --noti-ink:#a9d167; --noti-dot:#7ab648;
      --rech-bg:#351512; --rech-ink:#ef8579; --rech-dot:#e0463a;
    }

    /* Barra de scroll fina, en los colores de la paleta (hereda claro/oscuro por las CSS vars).
       Aplicar en cualquier caja con overflow propio; el navegador si no dibuja la barra nativa
       del sistema, que corta el look del resto de las tarjetas. */
    .scroll-fino { scrollbar-width: thin; scrollbar-color: var(--linestrong) transparent; }
    .scroll-fino::-webkit-scrollbar { width: 0.625rem; height: 0.625rem; }
    .scroll-fino::-webkit-scrollbar-track { background: transparent; }
    /* El borde transparente + background-clip deja aire entre el pulgar y el borde de la caja,
       para que no quede pegado al filo redondeado de la tarjeta. */
    .scroll-fino::-webkit-scrollbar-thumb {
      background: var(--linestrong); border-radius: 999px;
      border: 0.1875rem solid transparent; background-clip: content-box;
    }
    .scroll-fino::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: content-box; }
  </style>
  <script>
    (function () {
        var s = localStorage.getItem('fontScale');
        if (s) document.documentElement.style.fontSize = s + '%';
        if (localStorage.getItem('tema') === 'dark') document.documentElement.classList.add('dark');
    })();
   </script>
  <script src="{% static 'vendor/htmx-2.0.4.min.js' %}"></script>
  <script src="{% static 'vendor/tom-select/tom-select-2.3.1.complete.min.js' %}"></script>
</head>

<script>
  window.setFont = function (dir) {
    var niveles = [90, 100, 110, 120];               // % del tamaño base
    var actual = parseInt(localStorage.getItem('fontScale') || '100', 10);
    var i = niveles.indexOf(actual); if (i < 0) i = 1;
    if (dir === 0) i = 1;                             // reset a 100%
    else i = Math.min(niveles.length - 1, Math.max(0, i + dir));
    document.documentElement.style.fontSize = niveles[i] + '%';
    localStorage.setItem('fontScale', niveles[i]);
  };
  window.alternarTema = function () {
    var oscuro = document.documentElement.classList.toggle('dark');
    localStorage.setItem('tema', oscuro ? 'dark' : 'claro');
  };

  // --- Menú hamburguesa del header (solo bajo el breakpoint xl) ---
  (function () {
    function panel()  { return document.getElementById('menu-movil'); }
    function boton()  { return document.getElementById('boton-menu'); }

    function pintar(abierto) {
      var p = panel(), b = boton();
      if (!p || !b) return;
      p.classList.toggle('hidden', !abierto);
      b.setAttribute('aria-expanded', abierto ? 'true' : 'false');
      b.setAttribute('aria-label', abierto ? 'Cerrar menú de navegación' : 'Abrir menú de navegación');
      b.querySelector('[data-icono="abrir"]').classList.toggle('hidden', abierto);
      b.querySelector('[data-icono="cerrar"]').classList.toggle('hidden', !abierto);
    }

    window.alternarMenu = function () {
      var p = panel();
      if (p) pintar(p.classList.contains('hidden'));
    };
    window.cerrarMenu = function () { pintar(false); };

    // Click fuera del header: cierra. Un click en un link del panel navega igual, pero el
    // cierre deja el estado limpio si la navegación no ocurre (ancla, target nuevo, etc).
    document.addEventListener('click', function (e) {
      var p = panel();
      if (!p || p.classList.contains('hidden')) return;
      if (!e.target.closest('header')) cerrarMenu();
      else if (e.target.closest('#menu-movil a')) cerrarMenu();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') cerrarMenu();
    });

    // Al pasar a pantalla ancha el CSS ya esconde el panel (xl:hidden); esto sincroniza el
    // aria-expanded y el ícono para que no queden mostrando el estado "abierto".
    window.addEventListener('resize', function () {
      if (window.matchMedia('(min-width: 1280px)').matches) cerrarMenu();
    });
  })();
</script>

<body class="min-h-screen bg-appbg text-body font-sans antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% if user.is_authenticated %}{% include "partials/_header.html" %}{% endif %}

  <main class="{% block ancho %}max-w-[1600px]{% endblock %} w-full mx-auto px-6 pt-7 pb-28">
    {% block content %}{% endblock %}
  </main>

  {{ COMUNAS_CL|json_script:"comunas-data" }}
  <div id="modal"></div>
  <div id="toasts" class="fixed top-[70px] right-5 z-[60] flex flex-col gap-2.5"></div>
  {% include "partials/_toast.html" %}

  <script>
    // Selección por lote: cuenta marcados y muestra/oculta la(s) barra(s) de acciones.
    function avisarSeleccion() {
      var marcados = document.querySelectorAll('input[name="ids"]:checked').length;
      document.querySelectorAll('[data-barra-acciones]').forEach(function (barra) {
        barra.classList.toggle('hidden', marcados === 0);
        var conteo = barra.querySelector('[data-conteo]');
        if (conteo) conteo.textContent = marcados;
      });
    }
    function seleccionarTodo(origen) {
      document.querySelectorAll('input[name="ids"]').forEach(function (cb) { cb.checked = origen.checked; });
      avisarSeleccion();
    }
    // Al recargar la tabla por filtro/HTMX, los checkboxes se resetean → recontar.
    document.body.addEventListener('htmx:afterSwap', function (e) {
      if (e.target.id === 'tabla-pedidos') avisarSeleccion();
    });

    // Tom Select en los campos de comuna (input[data-comuna]). Reusa la lista COMUNAS_CL inyectada como #comunas-data.
    function initComunas(scope) {
      if (typeof TomSelect === 'undefined') return;
      var datos = document.getElementById('comunas-data');
      var lista = datos ? JSON.parse(datos.textContent) : [];
      (scope || document).querySelectorAll('input[data-comuna]').forEach(function (el) {
        if (el.tomselect) return;                       // no re-inicializar
        var valorPrecargado = el.value;                 // Tom Select no lo lee solo — hay que pasarlo a mano
        var ts = new TomSelect(el, {
          options: lista.map(function (c) { return { value: c, text: c }; }),
          create: true, maxItems: 1, persist: false,    // create:true permite escribir un valor nuevo, no precarga solo
        });
        if (valorPrecargado) {
          ts.addOption({value: valorPrecargado, text: valorPrecargado});  // por si no matchea la lista (SAP/Woo)
          ts.addItem(valorPrecargado, true);  // silent=true: no dispara 'change' al precargar
        }
      });
    }
    document.addEventListener('DOMContentLoaded', function () { initComunas(); });
    document.body.addEventListener('htmx:afterSwap', function (e) { initComunas(e.target); });

    // En el form de editar pedido: Retiro en Bioquímica no usa courier (se deshabilita y limpia) pero
    // sí usa Retiro en; Despacho es lo inverso. Al cambiar Tipo de entrega, ambos se ajustan solos.
    function actualizarCourierPorTipoEntrega(scope) {
      var tipoEntrega = (scope || document).querySelector('#id_tipo_entrega');
      var courier = (scope || document).querySelector('#id_courier');
      var retirarEn = (scope || document).querySelector('#id_retirar_en');
      if (!tipoEntrega || (!courier && !retirarEn)) return;
      function aplicar() {
        var esRetiro = tipoEntrega.value === 'RETIRO_BIOQUIMICA';
        if (courier) {
          courier.disabled = esRetiro;
          if (esRetiro) courier.value = '';
        }
        if (retirarEn) {
          retirarEn.disabled = !esRetiro;
          if (!esRetiro) retirarEn.value = 'NO_APLICA';
        }
      }
      tipoEntrega.addEventListener('change', aplicar);
      aplicar();
    }
    document.body.addEventListener('htmx:afterSwap', function (e) { actualizarCourierPorTipoEntrega(e.target); });
    // Navega al form de despacho llevando los ids seleccionados en la URL.
    function despacharSeleccion(boton) {
      var ids = Array.from(document.querySelectorAll('input[name="ids"]:checked')).map(function (c) { return c.value; });
      if (!ids.length) { showToast({level: 'error', body: 'Selecciona al menos un pedido.'}); return; }
      window.location = boton.dataset.url + '?ids=' + ids.join(',');
    }
    // Notifica los pedidos seleccionados (mismo chequeo de selección vacía que despacharSeleccion).
    function notificarSeleccion(boton) {
      var ids = Array.from(document.querySelectorAll('input[name="ids"]:checked')).map(function (c) { return c.value; });
      if (!ids.length) { showToast({level: 'error', body: 'Selecciona al menos un pedido.'}); return; }
      htmx.ajax('POST', boton.dataset.url, {values: {ids: ids}});
    }
    // Duplica los pedidos seleccionados (mismo patrón que notificarSeleccion).
    function duplicarSeleccion(boton) {
      var ids = Array.from(document.querySelectorAll('input[name="ids"]:checked')).map(function (c) { return c.value; });
      if (!ids.length) { showToast({level: 'error', body: 'Selecciona al menos un pedido.'}); return; }
      htmx.ajax('POST', boton.dataset.url, {values: {ids: ids}});
    }
  </script>
</body>
</html>
