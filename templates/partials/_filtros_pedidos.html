<div class="flex flex-col gap-1.5">
  <span class="text-xs font-bold uppercase tracking-wide text-muted mb-0.5">Estado</span>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="estado" value="recien_ingresado" data-filtro class="accent-brand w-4 h-4" {% if 'recien_ingresado' in sel_estado %}checked{% endif %}> Recién Ingresado</label>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="estado" value="cargado_sin_notificar" data-filtro class="accent-brand w-4 h-4" {% if 'cargado_sin_notificar' in sel_estado %}checked{% endif %}> Cargado (sin notificar)</label>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="estado" value="cargado_notificado" data-filtro class="accent-brand w-4 h-4" {% if 'cargado_notificado' in sel_estado %}checked{% endif %}> Cargado y Notificado</label>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="estado" value="notificado_retiro" data-filtro class="accent-brand w-4 h-4" {% if 'notificado_retiro' in sel_estado %}checked{% endif %}> Notificado (Retiro BQ)</label>
</div>
<div class="flex flex-col gap-1.5 border-t border-line pt-3">
  <span class="text-xs font-bold uppercase tracking-wide text-muted mb-0.5">Courier</span>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="courier" value="CHIBRA" data-filtro class="accent-brand w-4 h-4" {% if 'CHIBRA' in sel_courier %}checked{% endif %}> Chibra</label>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="courier" value="MOVEUP" data-filtro class="accent-brand w-4 h-4" {% if 'MOVEUP' in sel_courier %}checked{% endif %}> MoveUP</label>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="courier" value="STARKEN" data-filtro class="accent-brand w-4 h-4" {% if 'STARKEN' in sel_courier %}checked{% endif %}> Starken</label>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="courier" value="CYS" data-filtro class="accent-brand w-4 h-4" {% if 'CYS' in sel_courier %}checked{% endif %}> C&S</label>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="courier" value="BIOQUIMICACL" data-filtro class="accent-brand w-4 h-4" {% if 'BIOQUIMICACL' in sel_courier %}checked{% endif %}> Bioquimica.cl</label>
</div>
<div class="flex flex-col gap-1.5 border-t border-line pt-3">
  <span class="text-xs font-bold uppercase tracking-wide text-muted mb-0.5">Entrega</span>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="tipo" value="DESPACHO" data-filtro class="accent-brand w-4 h-4" {% if 'DESPACHO' in sel_tipo %}checked{% endif %}> Despacho</label>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="tipo" value="RETIRO_BIOQUIMICA" data-filtro class="accent-brand w-4 h-4" {% if 'RETIRO_BIOQUIMICA' in sel_tipo %}checked{% endif %}> Retiro en Bioquímica</label>
</div>
<div class="flex flex-col gap-1.5 border-t border-line pt-3">
  <span class="text-xs font-bold uppercase tracking-wide text-muted mb-0.5">Origen</span>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="origen" value="SAP" data-filtro class="accent-brand w-4 h-4" {% if 'SAP' in sel_origen %}checked{% endif %}> SAP</label>
  <label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" name="origen" value="WEB" data-filtro class="accent-brand w-4 h-4" {% if 'WEB' in sel_origen %}checked{% endif %}> WEB (tienda)</label>
</div>
